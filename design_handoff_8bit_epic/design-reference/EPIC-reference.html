  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes barber { to { background-position: 24px 0; } }
  @keyframes pulseGlow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(95,224,138,0)); } 50% { filter: drop-shadow(0 0 7px rgba(95,224,138,.9)); } }
